<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.4/semantic.min.css">
        <title>Contact Page</title>
        <link rel="stylesheet" href="myCss.css">
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.4/semantic.js"></script>
        <main>
            <a id="homeIcon" href="index.html"><i></i></a>
        <div class="ui stackable grid container">
            <div class="ui top attached tabular menu">
                <a class="item" href="index.html">Home Page</a>
                <a class="item" href="introduction.html">Introduction Page</a>
                <a class="item" href="hobbies.html">Hobbies Page</a>
                <a class="item" href="interests.html">Interests Page</a>
                <a class="active item" href="contact.html">Contact Me</a>
            </div>
            <div>
                <form>
                    <label for="fname">First Name:</label><br>
                    <input type="text" id="fname" name="fname" pattern="[A-Za-z]{10}"><br>
                    <label for="age">Age:</label><br>
                    <input type="date" id="age" name="age"><br>
                    <label for="rating">Rating of Site(1-5):</label><br>
                    <input type="number" id="rating" name="rating" min="1" max="5"><br>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$">
                    <label for="comment">Comments:</label>
                    <input type="text" name="comment" id="comment" pattern="[A-Za-z]{150}">
                </form>
            </div>
        </div>
        </main>
        <header></header>
    </body>
</html>
